name: CI

on :
 push:
   branches: [main]
 pull_request: 
   branches: [main]

jobs : 
  build-and-test:
   runs-on : ubuntu-latest
   steps:
      - name: Checkout code
        uses: actions/checkout@v4 
      - name: setup node js 
        uses: actions/setup-node@v4
        with:
           node-version: 20
           cache: npm
      - name: install dependecies
        run: npm ci

      - name: run tests
        run: npm test -- --watchAll=false
      - name: build project
        run: npm run build